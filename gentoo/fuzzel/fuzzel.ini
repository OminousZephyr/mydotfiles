font=monospace:size=13
dpi-aware=yes
fields=name,generic,comment,exec
terminal=alacritty

[colors]
# Background: dark base
background=191724ff
# Text: Rose Pine base
text=e0def4ff
# Match: neon pink
match=ff6ac1ff
# Selection background: soft cyan
selection=26233aff
# Selection text: bright pastel (Rose Pine highlight)
selection-text=f5e0dcff
# Border: neon pink (simulates gradient to cyan)
border=ff6ac1ff

[border]
width=2
radius=6
