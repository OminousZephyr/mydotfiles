[main]
# Use a modern, crisp font. JetBrains Mono or Hack are excellent choices.
font=JetBrains Mono:size=14,Noto Sans Mono:size=14,Symbols Nerd Font:size=14
font-bold=JetBrains Mono:size=14:style=Bold
font-italic=JetBrains Mono:size=14:style=Italic

# Set initial window dimensions (columns x rows)
initial-window-size-chars=90x24

# Pad the text away from the window edges slightly
pad=8x8

# Specify your preferred shell (defaults to system default if commented out)
# shell=/bin/bash

[scrollback]
# Store up to 10,000 lines of scroll history
lines=10000

[cursor]
# Make the cursor stand out without blinking
style=beam
blink=no

[colors]

alpha=0.75

foreground=e0def4
background=232136

selection-foreground=e0def4
selection-background=44415a

regular0=393552
regular1=eb6f92
regular2=3e8fb0
regular3=f6c177
regular4=9ccfd8
regular5=c4a7e7
regular6=ea9a97
regular7=e0def4

bright0=817c9c
bright1=eb6f92
bright2=3e8fb0
bright3=f6c177
bright4=9ccfd8
bright5=c4a7e7
bright6=ea9a97
bright7=e0def4

[key-bindings]
# Quick window and text manipulation
scrollback-up-page=Shift+Page_Up
scrollback-down-page=Shift+Page_Down
font-increase=Control+plus Control+equal
font-decrease=Control+minus
font-reset=Control+0
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
