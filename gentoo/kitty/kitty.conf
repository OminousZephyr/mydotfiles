# ---------------------------------------------------------
# Fonts
# ---------------------------------------------------------
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14

# ---------------------------------------------------------
# Window Layout & Padding
# ---------------------------------------------------------
remember_window_size  yes
initial_width        950
initial_height       600
window_padding_width 12
confirm_os_window_close 0

# ---------------------------------------------------------
# Performance & Styling
# ---------------------------------------------------------
repaint_delay    8
input_delay      1
sync_to_monitor  yes
enable_audio_bell no

# Subtle background transparency 
background_opacity 0.92
dynamic_background_opacity yes

# ---------------------------------------------------------
# Color Scheme: Rose Pine
# ---------------------------------------------------------
background            #191724
foreground            #e0def4
selection_background  #403d52
selection_foreground  #e0def4
url_color             #c4a7e7
cursor                #524f67
cursor_text_color     #e0def4

# Black
color0  #26233a
color8  #6e6a86

# Red
color1  #eb6f92
color9  #eb6f92

# Green
color2  #31748f
color10 #31748f

# Yellow
color3  #f6c177
color11 #f6c177

# Blue
color4  #9ccfd8
color12 #9ccfd8

# Magenta
color5  #c4a7e7
color13 #c4a7e7

# Cyan
color6  #ebbcba
color14 #ebbcba

# White
color7  #e0def4
color15 #e0def4

# ---------------------------------------------------------
# Mouse & Keyboard binds
# ---------------------------------------------------------
detect_urls yes
mouse_hide_wait 3.0

# Quick config reload shortcut (Ctrl+Shift+F5)
map ctrl+shift+f5 load_config_file
